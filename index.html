<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Miguel Enrique Zambrano — Portfolio</title>
  <meta name="description" content="Portfolio de Miguel Enrique Zambrano Contreras. Proyectos de desarrollo cargados en directo desde GitHub." />
  <meta name="author" content="Miguel Enrique Zambrano Contreras" />
  <meta name="theme-color" content="#0f1115" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Miguel Enrique Zambrano — Portfolio" />
  <meta property="og:description" content="Proyectos de desarrollo cargados en directo desde GitHub." />
  <meta property="og:url" content="https://MikeChamp4.github.io/" />

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#9889;</text></svg>" />

  <style>
    /* ============ THEME TOKENS ============ */
    :root {
      --accent: #059669;
      --accent-soft: rgba(5, 150, 105, 0.12);
      --radius: 14px;
      --maxw: 1200px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --transition: 180ms ease;
    }

    html[data-theme="dark"] {
      --bg: #0f1115;
      --bg-elev: #161920;
      --bg-card: #171a21;
      --border: #242833;
      --text: #e8e8ea;
      --text-dim: #9aa0ac;
      --text-faint: #6b7280;
      --shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
    }

    html[data-theme="light"] {
      --bg: #f7f8fa;
      --bg-elev: #ffffff;
      --bg-card: #ffffff;
      --border: #e4e7ec;
      --text: #1a1d23;
      --text-dim: #51596a;
      --text-faint: #8b93a3;
      --shadow: 0 8px 30px rgba(16, 24, 40, 0.08);
    }

    /* ============ RESET ============ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      transition: background var(--transition), color var(--transition);
    }

    a { color: inherit; text-decoration: none; }

    ::selection { background: var(--accent); color: #fff; }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { transition: none !important; animation: none !important; }
    }

    /* ============ LAYOUT ============ */
    .wrap {
      max-width: var(--maxw);
      margin: 0 auto;
      padding: 0 28px;
      display: grid;
      grid-template-columns: minmax(300px, 380px) 1fr;
      gap: 60px;
    }

    @media (max-width: 900px) {
      .wrap { grid-template-columns: 1fr; gap: 0; padding: 0 20px; }
    }

    /* ============ SIDEBAR / HERO ============ */
    .side {
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 70px 0 40px;
    }

    @media (max-width: 900px) {
      .side { position: static; height: auto; padding: 50px 0 30px; }
    }

    .avatar {
      width: 72px; height: 72px;
      border-radius: 50%;
      border: 2px solid var(--border);
      object-fit: cover;
      margin-bottom: 22px;
      background: var(--bg-elev);
    }

    .hero-name {
      font-size: clamp(1.9rem, 4vw, 2.6rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .hero-role {
      margin-top: 14px;
      font-size: 1.05rem;
      color: var(--text-dim);
      max-width: 34ch;
      min-height: 1.6em;
    }

    .hero-cta {
      margin-top: 28px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 0.92rem;
      font-weight: 600;
      border: 1px solid var(--border);
      background: var(--bg-elev);
      color: var(--text);
      transition: border-color var(--transition), transform var(--transition), background var(--transition);
    }

    .btn:hover { border-color: var(--accent); transform: translateY(-2px); }

    .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-primary:hover { filter: brightness(1.08); }

    .btn svg { width: 18px; height: 18px; }

    .side-foot {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* ============ CONTROLS (theme + lang) ============ */
    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .seg {
      display: inline-flex;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      background: var(--bg-elev);
    }

    .seg button {
      border: none;
      background: transparent;
      color: var(--text-dim);
      font: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 7px 11px;
      cursor: pointer;
      transition: background var(--transition), color var(--transition);
    }

    .seg button.active { background: var(--accent-soft); color: var(--accent); }
    .seg button:hover:not(.active) { color: var(--text); }

    .icon-btn {
      display: inline-grid;
      place-items: center;
      width: 38px; height: 38px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg-elev);
      color: var(--text);
      cursor: pointer;
      transition: border-color var(--transition), color var(--transition);
    }
    .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
    .icon-btn svg { width: 18px; height: 18px; }

    /* ============ MAIN / PROJECTS ============ */
    main { padding: 70px 0 90px; }

    @media (max-width: 900px) { main { padding: 10px 0 70px; } }

    .section-label {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-faint);
      margin-bottom: 24px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 22px;
    }

    .card {
      display: flex;
      flex-direction: column;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: border-color var(--transition), transform var(--transition), box-shadow var(--transition);
    }

    .card:hover {
      border-color: var(--accent);
      transform: translateY(-4px);
      box-shadow: var(--shadow);
    }

    .card-media {
      aspect-ratio: 16 / 9;
      width: 100%;
      object-fit: cover;
      background: var(--bg-elev);
      border-bottom: 1px solid var(--border);
      display: block;
    }

    .card-body {
      padding: 18px 18px 20px;
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 12px;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-title svg { width: 15px; height: 15px; color: var(--text-faint); transition: color var(--transition); }
    .card:hover .card-title svg { color: var(--accent); }

    .card-desc {
      font-size: 0.92rem;
      color: var(--text-dim);
      flex: 1;
    }

    .tags { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 4px; }

    .tag {
      font-family: var(--mono);
      font-size: 0.72rem;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid transparent;
    }

    /* ============ STATES ============ */
    .state {
      grid-column: 1 / -1;
      padding: 40px;
      text-align: center;
      color: var(--text-dim);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
    }

    .skeleton {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .skeleton .sk-media { aspect-ratio: 16/9; background: linear-gradient(90deg, var(--bg-elev), var(--border), var(--bg-elev)); background-size: 200% 100%; animation: shimmer 1.3s infinite; }
    .skeleton .sk-body { padding: 18px; }
    .skeleton .sk-line { height: 12px; border-radius: 6px; background: var(--bg-elev); margin-bottom: 10px; }
    .skeleton .sk-line.short { width: 55%; }

    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    footer {
      grid-column: 1 / -1;
      border-top: 1px solid var(--border);
      margin-top: 40px;
      padding-top: 26px;
      font-size: 0.82rem;
      color: var(--text-faint);
      font-family: var(--mono);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- ============ SIDEBAR ============ -->
    <aside class="side">
      <div>
        <img id="avatar" class="avatar" alt="Avatar" src="https://avatars.githubusercontent.com/u/113886000?v=4" />
        <h1 class="hero-name" id="heroName">Miguel Enrique Zambrano</h1>
        <p class="hero-role" id="heroRole"></p>
        <div class="hero-cta">
          <a class="btn btn-primary" href="https://github.com/MikeChamp4" target="_blank" rel="noopener" aria-label="GitHub">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5A11.5 11.5 0 0 0 .5 12a11.5 11.5 0 0 0 7.86 10.92c.57.1.78-.25.78-.55v-2c-3.2.7-3.87-1.37-3.87-1.37-.53-1.34-1.3-1.7-1.3-1.7-1.06-.72.08-.71.08-.71 1.17.08 1.78 1.2 1.78 1.2 1.04 1.78 2.73 1.27 3.4.97.1-.75.4-1.27.73-1.56-2.56-.3-5.25-1.28-5.25-5.7 0-1.26.45-2.29 1.2-3.1-.12-.3-.52-1.47.11-3.07 0 0 .98-.31 3.2 1.18a11.1 11.1 0 0 1 5.82 0C18.3 4.35 19.28 4.66 19.28 4.66c.63 1.6.23 2.77.11 3.07.75.81 1.2 1.84 1.2 3.1 0 4.43-2.7 5.4-5.27 5.69.41.36.78 1.06.78 2.14v3.17c0 .3.2.66.79.55A11.5 11.5 0 0 0 23.5 12 11.5 11.5 0 0 0 12 .5Z"/></svg>
            GitHub
          </a>
          <a class="btn" href="https://www.linkedin.com/in/miguel-enrique-zambrano-contreras-94301b241" target="_blank" rel="noopener" aria-label="LinkedIn">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.86 0-2.14 1.45-2.14 2.95v5.66H9.35V9h3.41v1.56h.05c.47-.9 1.63-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28ZM5.34 7.43a2.07 2.07 0 1 1 0-4.14 2.07 2.07 0 0 1 0 4.14ZM7.12 20.45H3.56V9h3.56v11.45ZM22.22 0H1.77C.8 0 0 .78 0 1.73v20.54C0 23.22.8 24 1.77 24h20.45c.98 0 1.78-.78 1.78-1.73V1.73C24 .78 23.2 0 22.22 0Z"/></svg>
            LinkedIn
          </a>
        </div>
      </div>

      <div class="side-foot">
        <div class="controls">
          <div class="seg" id="langSeg" role="tablist" aria-label="Language">
            <button data-lang="ca">CA</button>
            <button data-lang="es">ES</button>
            <button data-lang="en">EN</button>
          </div>
          <button class="icon-btn" id="themeBtn" aria-label="Toggle theme" title="Theme">
            <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
          </button>
        </div>
      </div>
    </aside>

    <!-- ============ MAIN ============ -->
    <main>
      <h2 class="section-label" id="projectsLabel">Proyectos</h2>
      <div class="grid" id="grid"></div>
      <footer id="footer"></footer>
    </main>
  </div>

  <script>
    // ================= CONFIG =================
    const GH_USER = "MikeChamp4";
    const TOPIC = "portfolio";
    const DEFAULT_BRANCH_PREVIEW = "preview.gif"; // file convention at the repo root

    // ================= I18N =================
    const I18N = {
      ca: {
        htmlLang: "ca",
        role: "Desenvolupador",
        projects: "Projectes",
        loading: "Carregant projectes des de GitHub…",
        empty: "Encara no hi ha projectes amb el topic \"portfolio\". Afegeix-lo als repositoris que vulguis mostrar.",
        error: "No s'han pogut carregar els projectes des de GitHub. Torna-ho a provar més tard.",
        noDesc: "Sense descripció. Afegeix-ne una a la secció About del repositori.",
        view: "Veure a GitHub",
        foot: "Dades carregades en directe des de l'API de GitHub · Allotjat a GitHub Pages",
      },
      es: {
        htmlLang: "es",
        role: "Desarrollador",
        projects: "Proyectos",
        loading: "Cargando proyectos desde GitHub…",
        empty: "Aún no hay proyectos con el topic \"portfolio\". Añádelo a los repositorios que quieras mostrar.",
        error: "No se pudieron cargar los proyectos desde GitHub. Inténtalo de nuevo más tarde.",
        noDesc: "Sin descripción. Añade una en la sección About del repositorio.",
        view: "Ver en GitHub",
        foot: "Datos cargados en directo desde la API de GitHub · Alojado en GitHub Pages",
      },
      en: {
        htmlLang: "en",
        role: "Developer",
        projects: "Projects",
        loading: "Loading projects from GitHub…",
        empty: "No projects with the \"portfolio\" topic yet. Add it to the repositories you want to show.",
        error: "Could not load projects from GitHub. Please try again later.",
        noDesc: "No description. Add one in the repository's About section.",
        view: "View on GitHub",
        foot: "Data loaded live from the GitHub API · Hosted on GitHub Pages",
      },
    };

    // ================= THEME =================
    const SUN = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
    const MOON = '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>';

    function applyTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      document.getElementById("themeIcon").innerHTML = theme === "dark" ? MOON : SUN;
      try { localStorage.setItem("theme", theme); } catch (e) {}
    }

    document.getElementById("themeBtn").addEventListener("click", () => {
      const cur = document.documentElement.getAttribute("data-theme");
      applyTheme(cur === "dark" ? "light" : "dark");
    });

    // ================= LANG =================
    let currentLang = "es";
    let cachedRepos = null; // re-render without re-fetching the API

    function applyLang(lang) {
      currentLang = lang;
      const t = I18N[lang];
      document.documentElement.lang = t.htmlLang;
      document.getElementById("projectsLabel").textContent = t.projects;
      document.getElementById("footer").textContent = t.foot;
      // mark active button
      document.querySelectorAll("#langSeg button").forEach(b => {
        b.classList.toggle("active", b.dataset.lang === lang);
      });
      // role fallback if bio is not available
      const heroRole = document.getElementById("heroRole");
      if (heroRole.dataset.fromBio !== "true") heroRole.textContent = t.role;
      try { localStorage.setItem("lang", lang); } catch (e) {}
      // re-render grid state/messages
      if (cachedRepos !== null) renderProjects(cachedRepos);
    }

    document.querySelectorAll("#langSeg button").forEach(b => {
      b.addEventListener("click", () => applyLang(b.dataset.lang));
    });

    // ================= PROFILE (name + bio from GitHub) =================
    async function loadProfile() {
      try {
        const res = await fetch(`https://api.github.com/users/${GH_USER}`);
        if (!res.ok) return;
        const u = await res.json();
        if (u.name) document.getElementById("heroName").textContent = u.name;
        if (u.avatar_url) document.getElementById("avatar").src = u.avatar_url;
        if (u.bio) {
          const el = document.getElementById("heroRole");
          el.textContent = u.bio;
          el.dataset.fromBio = "true"; // do not overwrite on language change
        }
      } catch (e) { /* silent: hero already has default values */ }
    }

    // ================= PROJECTS =================
    const GH_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5A11.5 11.5 0 0 0 .5 12a11.5 11.5 0 0 0 7.86 10.92c.57.1.78-.25.78-.55v-2c-3.2.7-3.87-1.37-3.87-1.37-.53-1.34-1.3-1.7-1.3-1.7-1.06-.72.08-.71.08-.71 1.17.08 1.78 1.2 1.78 1.2 1.04 1.78 2.73 1.27 3.4.97.1-.75.4-1.27.73-1.56-2.56-.3-5.25-1.28-5.25-5.7 0-1.26.45-2.29 1.2-3.1-.12-.3-.52-1.47.11-3.07 0 0 .98-.31 3.2 1.18a11.1 11.1 0 0 1 5.82 0C18.3 4.35 19.28 4.66 19.28 4.66c.63 1.6.23 2.77.11 3.07.75.81 1.2 1.84 1.2 3.1 0 4.43-2.7 5.4-5.27 5.69.41.36.78 1.06.78 2.14v3.17c0 .3.2.66.79.55A11.5 11.5 0 0 0 23.5 12 11.5 11.5 0 0 0 12 .5Z"/></svg>';

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
    }

    function skeletons(n = 4) {
      let html = "";
      for (let i = 0; i < n; i++) {
        html += `<div class="skeleton"><div class="sk-media"></div><div class="sk-body"><div class="sk-line"></div><div class="sk-line short"></div></div></div>`;
      }
      return html;
    }

    function cardHtml(repo) {
      const t = I18N[currentLang];
      const desc = repo.description ? escapeHtml(repo.description) : `<em>${t.noDesc}</em>`;
      const tags = (repo._languages || []).map(l => `<span class="tag">${escapeHtml(l)}</span>`).join("");
      const gif = `https://raw.githubusercontent.com/${GH_USER}/${encodeURIComponent(repo.name)}/${encodeURIComponent(repo.default_branch)}/${DEFAULT_BRANCH_PREVIEW}`;
      const og = `https://opengraph.githubassets.com/1/${GH_USER}/${encodeURIComponent(repo.name)}`;
      return `
        <a class="card" href="${escapeHtml(repo.html_url)}" target="_blank" rel="noopener">
          <img class="card-media" loading="lazy" alt="${escapeHtml(repo.name)}"
               src="${gif}" onerror="this.onerror=null;this.src='${og}';" />
          <div class="card-body">
            <div class="card-title">${GH_ICON}${escapeHtml(repo.name)}</div>
            <p class="card-desc">${desc}</p>
            <div class="tags">${tags}</div>
          </div>
        </a>`;
    }

    function renderProjects(repos) {
      const grid = document.getElementById("grid");
      const t = I18N[currentLang];
      if (!repos || repos.length === 0) {
        grid.innerHTML = `<div class="state">${t.empty}</div>`;
        return;
      }
      grid.innerHTML = repos.map(cardHtml).join("");
    }

    async function loadProjects() {
      const grid = document.getElementById("grid");
      grid.innerHTML = skeletons();
      try {
        const res = await fetch(`https://api.github.com/users/${GH_USER}/repos?per_page=100&sort=updated`, {
          headers: { "Accept": "application/vnd.github+json" }
        });
        if (!res.ok) throw new Error("repos " + res.status);
        let repos = await res.json();

        // filter by topic
        repos = repos.filter(r => Array.isArray(r.topics) && r.topics.includes(TOPIC) && !r.fork);

        // load languages in parallel
        await Promise.all(repos.map(async r => {
          try {
            const lr = await fetch(r.languages_url);
            r._languages = lr.ok ? Object.keys(await lr.json()) : [];
          } catch (e) { r._languages = []; }
        }));

        cachedRepos = repos;
        renderProjects(repos);
      } catch (e) {
        cachedRepos = [];
        grid.innerHTML = `<div class="state">${I18N[currentLang].error}</div>`;
      }
    }

    // ================= INIT =================
    (function init() {
      // theme: user's stored preference > dark by default (always)
      let theme = "dark";
      try { theme = localStorage.getItem("theme") || "dark"; } catch (e) {}
      applyTheme(theme);

      // language: stored > Spanish
      let lang = "es";
      try { lang = localStorage.getItem("lang") || "es"; } catch (e) {}
      if (!I18N[lang]) lang = "es";
      applyLang(lang);

      loadProfile();
      loadProjects();
    })();
  </script>
</body>
</html>
